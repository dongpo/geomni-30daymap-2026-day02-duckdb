<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geomni 互動地圖</title><link rel="stylesheet" href="vendor/maplibre-gl.css"><style>body{margin:0;background:#0c1c2b;color:#eaf2ee;font-family:'PingFang TC',sans-serif}#map{height:490px}#toolbar{padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{background:#183345;border:1px solid #456474;color:#eaf2ee;border-radius:5px;padding:7px}#info{font-size:12px;padding:5px 16px 12px;line-height:1.6;overflow-wrap:anywhere}#status{color:#60d4c4;font-size:12px}.maplibregl-popup-content{background:#183345;color:white;font-size:12px;max-width:280px;overflow-wrap:anywhere}.map-label{color:white;text-shadow:0 1px 4px #000;font-size:11px}.maplibregl-ctrl-attrib{font-size:9px}</style><div id="toolbar"><span id="status">載入實際地理資料…</span><button id="reset">重設範圍</button><select id="filter" aria-label="道路顯示範圍" hidden><option value="all">全部道路線段</option><option value="main">只看主要道路</option></select><select id="example" aria-label="GERS 關聯實例" hidden><option value="">選擇 GERS 關聯實例</option></select></div><div id="map"></div><div id="info">可拖曳與縮放地圖，點選圖徵查看資料。</div><script src="vendor/maplibre-gl.js"></script><script>const GERS={features:[]};</script><script>
const day=2;const bounds=day===1?[[121.50,25.02],[121.58,25.08]]:[[120.80,24.55],[121.95,25.35]];const map=new maplibregl.Map({container:'map',style:{version:8,sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':'#0c1c2b'}}]},bounds,fitBoundsOptions:{padding:24},attributionControl:false});map.addControl(new maplibregl.NavigationControl());map.addControl(new maplibregl.ScaleControl({unit:'metric'}));map.addControl(new maplibregl.AttributionControl({compact:false,customAttribution:'Overture Maps Foundation · '+(day===2?'© OpenStreetMap contributors / ODbL':'POI: CDLA / CC0 / Apache 2.0')}));let loaded=false;
function info(f,lnglat){const p=f.properties;const box=document.createElement('div');const title=document.createElement('strong');title.textContent=p.name||'未提供名稱';box.append(title);const desc=document.createElement('div');desc.textContent=(p.category||p.class||'POI')+' · '+p.id;box.append(desc);const e=GERS.features.find(x=>x.properties.id===p.id);let text=(p.name||'未提供名稱')+'｜'+(p.category||p.class||'POI')+'｜ID：'+p.id;if(e){text+='\n來源鍵：'+e.properties.sources.filter(s=>s.record_id).map(s=>s.provider+' / '+s.record_id).join('；');text+='\n官方 Bridge 與 Registry 已核對；不是獨立資料配對測試。'}document.getElementById('info').textContent=text;new maplibregl.Popup().setLngLat(lnglat).setDOMContent(box).addTo(map)}
(async()=>{try{const response=await fetch('data.geojson.gz');if(!response.ok)throw Error('HTTP '+response.status);const stream=response.body.pipeThrough(new DecompressionStream('gzip'));window.MAPDATA=await new Response(stream).json();loaded=true;if(map.isStyleLoaded())draw();else map.once('load',draw)}catch(e){document.getElementById('status').textContent='載入失敗：'+e.message}})();
function draw(){map.addSource('data',{type:'geojson',data:MAPDATA});if(day===1){map.addLayer({id:'features',type:'circle',source:'data',paint:{'circle-radius':['interpolate',['linear'],['zoom'],10,1,15,3,18,6],'circle-color':'#60d4c4','circle-opacity':.5}});map.addSource('gers',{type:'geojson',data:GERS});map.addLayer({id:'highlight',type:'circle',source:'gers',paint:{'circle-radius':7,'circle-color':'#ffbf69','circle-stroke-color':'#0c1c2b','circle-stroke-width':1.5}});const sel=document.getElementById('example');sel.hidden=false;for(const f of GERS.features){const o=document.createElement('option');o.value=f.properties.id;o.textContent=f.properties.name;sel.append(o)}sel.onchange=()=>{const f=GERS.features.find(x=>x.properties.id===sel.value);if(f){map.flyTo({center:f.geometry.coordinates,zoom:15});info(f,f.geometry.coordinates)}};document.getElementById('status').textContent='95,877 筆 POI · 金色 9 個 GERS 實例'}else{map.addLayer({id:'features',type:'line',source:'data',paint:{'line-color':['match',['get','class'],['motorway','trunk'],'#ffbf69',['primary','secondary','tertiary'],'#60d4c4','#577282'],'line-width':['match',['get','class'],['motorway','trunk'],2,['primary','secondary','tertiary'],1,.5]}});document.getElementById('filter').hidden=false;document.getElementById('filter').onchange=e=>map.setFilter('features',e.target.value==='main'?['in',['get','class'],['literal',['motorway','trunk','primary','secondary','tertiary']]]:null);document.getElementById('status').textContent='319,935 筆線段 · 網頁幾何簡化 3 m';for(const[name,xy]of[['台北',[121.52,25.04]],['桃園',[121.30,24.99]],['新竹',[120.97,24.81]],['基隆',[121.74,25.13]]]){const el=document.createElement('div');el.className='map-label';el.textContent=name;new maplibregl.Marker({element:el}).setLngLat(xy).addTo(map)}}map.on('click',e=>{const fs=map.queryRenderedFeatures(e.point,{layers:day===1?['highlight','features']:['features']});if(fs.length)info(fs[0],e.lngLat)});}
document.getElementById('reset').onclick=()=>map.fitBounds(bounds,{padding:24});
</script></html>
